<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moot Court AI — Sign In</title>
    <link rel="stylesheet" href="login.css">
    
    <!-- Supabase CDN & Helper -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <!-- Theme JS -->
    <script src="theme.js"></script>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="login-navbar">
        <a href="landing.html" class="nav-back-link">
            <span>←</span> Back to Home
        </a>

        <a href="landing.html" class="brand-logo">
            <span class="brand-icon">⚖️</span>
            <span class="brand-title">Moot Court AI</span>
        </a>

        <button class="btn-theme" id="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">☀️</button>
    </nav>

    <!-- MAIN WRAPPER -->
    <div class="login-wrapper">
        <!-- Floating Legal Symbols -->
        <div class="floating-symbols">
            <span class="float-item float-1">⚖️</span>
            <span class="float-item float-2">📜</span>
            <span class="float-item float-3">🏛️</span>
            <span class="float-item float-4">⚒️</span>
        </div>

        <!-- LOGIN SECTION -->
        <div class="glass-card" id="login-section">
            <div class="card-header">
                <span class="card-logo-icon">⚖️</span>
                <h1 class="card-title">Welcome Back</h1>
                <p class="card-subtitle">Sign in to resume your legal practice sessions</p>
            </div>

            <form id="login-form">
                <div id="login-error" class="error-msg"></div>

                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="login-email" class="form-input" placeholder="counsel@example.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required />
                        <button type="button" class="toggle-password-btn" data-target="login-password">👁</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">Sign In →</button>
            </form>

            <div class="divider-row">
                <div class="divider-line"></div>
                <span class="divider-text">OR</span>
                <div class="divider-line"></div>
            </div>

            <div class="social-btns">
                <button type="button" class="google-btn" id="google-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px; vertical-align: middle;">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continue with Google
                </button>

                <button type="button" class="guest-btn" id="guest-btn">👤 Continue as Guest</button>
            </div>

            <div class="card-footer">
                <span>Don't have an account?</span>
                <button type="button" onclick="showSignup()">Sign up</button>
            </div>
        </div>

        <!-- SIGNUP SECTION -->
        <div class="glass-card" id="signup-section" style="display:none">
            <div class="card-header">
                <span class="card-logo-icon">🏛️</span>
                <h1 class="card-title">Create Account</h1>
                <p class="card-subtitle">Start your legal moot court advocacy journey</p>
            </div>

            <form id="signup-form">
                <div id="signup-error" class="error-msg"></div>
                <div id="signup-success" class="success-msg"></div>

                <div class="form-group">
                    <label class="form-label" for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="signup-name" class="form-input" placeholder="Advocate Name" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="signup-email" class="form-input" placeholder="counsel@example.com" required />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="signup-password" class="form-input" placeholder="Min 6 characters" required />
                        <button type="button" class="toggle-password-btn" data-target="signup-password">👁</button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="signup-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="signup-confirm" class="form-input" placeholder="Confirm password" required />
                        <button type="button" class="toggle-password-btn" data-target="signup-confirm">👁</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="signup-btn">Create Account →</button>
            </form>

            <div class="card-footer">
                <span>Already have an account?</span>
                <button type="button" onclick="showLogin()">Sign in</button>
            </div>
        </div>
    </div>

    <!-- MAIN LOGIN SCRIPT -->
    <script src="login.js"></script>
</body>

</html>
